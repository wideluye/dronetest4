* 하층운(low-level clouds) : 중위도지방에서는 운저고도가 2km이하이며, 층운(Stratus), 난층운(Nimbostratus), 층적운(Stratocumulus)이 있다.
* 중층운(medium-level clouds) : 중위도지방에서는 구름 저면의 높이가 2~6km 정도이고, 중적운(Altocumulus), 중층운(Altostratus)이 있다.
* 상층운(high-level clouds) : 운저고도가 보통 6km 이상이고, 권운(Cirrus), 권적운(Cirrocumulus),권층운(Cirrostratus)이 있다.

**107.** O (무인동력비행장치의 150kg 이하 기준에 부합함)
**108.** ① (하강기류(Down-Draft)는 하늘에서 지상(아래) 방향으로 수직으로 내리꽂히는 바람임)
**109.** ④ (신규 신고 시 제출하는 기체 사진은 정면 사진이 아니라, 기체의 전장이 나오는 '측면 사진(15x10cm)'이어야 함)
**110.** ② (리튬폴리머 배터리는 에너지 밀도가 매우 높아 충격 시 폭발 및 화재 위험이 매우 큼)
**111.** ③ (표준대기는 해면상 기온 15도, 1013.25hPa을 기준으로 하며, 특정 결빙온도를 규정하지 않음)
**112.** ② (대형 기체일수록 무거운 하중을 이기고 양력을 발생시키기 위해 긴 직경의 프로펠러를 사용함)
**113.** ② (완전 충전 상태로 장기 보관 시 스웰링(부풀음) 현상이 발생하므로 50~70% 상태로 방전 후 보관해야 함)
**114.** ③ (IMU 센서는 미세한 정밀 기계 부품이므로 기체의 잔진동에 매우 취약하며 큰 영향을 받음)
**115.** ③ (육안 식별 상태에서의 비행은 금지사항이 아니라 무조건 지켜야 할 '필수 준수사항'임)
**116.** ④ (조종자 준수사항을 위반하고 비행한 자는 500만 원이 아닌 '300만 원 이하'의 과태료 대상임)
**117.** ② (전선안개는 냉각 현상이 아니라, 비가 내리면서 수증기가 공급되는 증발 과정에 의해 형성됨)
**118.** O (Liveware-Liveware: 사람과 사람 간의 관계 및 의사소통, 팀워크를 의미)
**119.** ③ (조언구역은 비관제공역에 속하므로, 엄격한 비행 인가가 필요한 통제공역에 속하지 않음)
**120.** X (충돌방지등 장착 조건 외에도 야간 비행 시에는 안전 확보를 위해 조종자 외 별도의 관찰자 배치가 필수임)
**121.** X (법령이 개정되면서 초경량비행장치 사용사업 등록 시 개인 및 법인의 자본금 요건은 완전 폐지되었음)`;

        const quizData = [];
        const qBlocks = rawQuestions.split(/\*\*\d+\.\s*/).filter(b => b.trim());
        const aBlocks = rawAnswers.split(/\*\*\d+\.\*\*\s*/).filter(b => b.trim());

        for (let idx = 0; idx < qBlocks.length; idx++) {
            const block = qBlocks[idx];
            const lines = block.split('\n').map(l => l.trim()).filter(l => l);
            
            // 문제 텍스트 추출 (꼬리표 제거)
            let questionText = lines[0].replace(/\*\*/g, '').trim();
            const options = [];
            
            // 보기 텍스트 추출 (꼬리표 제거)
            for (let i = 1; i < lines.length; i++) {
                if (lines[i].startsWith('* ')) {
                    options.push(lines[i].substring(2).trim());
                }
            }
            
            const ansLine = aBlocks[idx];
            let ansIdx = 1;
            let exp = "해설 없음";
            
            if (ansLine) {
                // 정답 번호와 해설 내용 추출 (꼬리표 제거)
                const match = ansLine.match(/^([①②③④OX])\s*\((.+)\)/);
                if (match) {
                    const aChar = match[1];
                    exp = match[2].trim(); 
                    if (aChar === '①' || aChar === 'O') ansIdx = 1;
                    else if (aChar === '②' || aChar === 'X') ansIdx = 2;
                    else if (aChar === '③') ansIdx = 3;
                    else if (aChar === '④') ansIdx = 4;
                }
            }

            quizData.push({
                question: questionText,
                options: options,
                answer: ansIdx,
                explanation: exp
            });
        }

            quizData.push({
                question: questionText,
                options: options,
                answer: ansIdx,
                explanation: exp
            });
        }

        const searchInput = document.getElementById('searchInput');
        const resultsContainer = document.getElementById('results');
        const resultCount = document.getElementById('result-count');

        function highlightText(text, query) {
            if (!query) return text;
            // 특수문자 이스케이프 처리
            const safeQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${safeQuery})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        function renderResults(data, query = "") {
            resultsContainer.innerHTML = '';
            resultCount.textContent = `검색 결과: 총 ${data.length}문제`;

            if(data.length === 0) {
                resultsContainer.innerHTML = '<div style="text-align:center; padding: 40px; color:#6b7280;">검색 결과가 없습니다. 다른 검색어를 입력해 보세요.</div>';
                return;
            }

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'question-card';

                const optionsHtml = item.options.map((opt, idx) => 
                    `<li>${idx + 1}. ${highlightText(opt, query)}</li>`
                ).join('');

                card.innerHTML = `
                    <div class="q-title">${highlightText(item.question, query)}</div>
                    <ul class="options">
                        ${optionsHtml}
                    </ul>
                    <div class="answer-box">
                        <span class="answer-num">정답: ${item.answer}번</span>
                        해설: ${highlightText(item.explanation, query)}
                    </div>
                `;
                resultsContainer.appendChild(card);
            });
        }

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            if (query === "") {
                renderResults(quizData);
                return;
            }

            const filteredData = quizData.filter(item => {
                const searchStr = query.toLowerCase();
                return item.question.toLowerCase().includes(searchStr) ||
                       item.options.some(opt => opt.toLowerCase().includes(searchStr)) ||
                       item.explanation.toLowerCase().includes(searchStr);
            });

            renderResults(filteredData, query);
        });

        // 초기 화면 (전체 문제 출력)
        renderResults(quizData);
    </script>
